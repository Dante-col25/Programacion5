<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StudentFlow · Recordatorios</title>
  <link rel="stylesheet" href="./css/recordatorios.css">
  <script type="module" src="./js/pages/recordatorios.js"></script>
</head>
<body>
  <main>
    <header><p class="eyebrow">StudentFlow</p><h1>Recordatorios</h1><p>Organiza avisos asociados a tus tareas y materias.</p></header>
    <p id="status" role="status" aria-live="polite">Cargando…</p>
    <section class="panel">
      <h2 id="form-title">Nuevo recordatorio</h2>
      <form id="form">
        <input id="recordatorio-id" type="hidden">
        <label>Tarea <select id="tarea" required></select></label>
        <label>Mensaje <input id="mensaje" maxlength="255" required></label>
        <label>Fecha y hora <input id="fecha-hora" type="datetime-local" required></label>
        <label>Canal <select id="canal"><option value="in_app">En la aplicación</option><option value="email">Correo electrónico</option></select></label>
        <label class="check"><input id="leido" type="checkbox"> Leído</label>
        <div class="actions"><button type="submit">Guardar</button><button id="cancel-edit" type="button" class="secondary" hidden>Cancelar edición</button></div>
      </form>
    </section>
    <section class="panel">
      <div class="toolbar"><h2>Mis recordatorios</h2>
        <label>Buscar <input id="search" type="search" placeholder="Mensaje, tarea o materia"></label>
        <label>Leído <select id="filter"><option value="">Todos</option><option value="false">Pendientes</option><option value="true">Leídos</option></select></label>
      </div>
      <div class="table-wrap"><table><thead><tr><th>Fecha</th><th>Mensaje</th><th>Tarea / materia</th><th>Canal</th><th>Estado</th><th>Acciones</th></tr></thead><tbody id="rows"></tbody></table></div>
      <div class="pagination"><button id="previous" class="secondary">Anterior</button><span id="page-label"></span><button id="next" class="secondary">Siguiente</button></div>
    </section>
  </main>
</body>
</html>
